<div class="alert-box" [ngStyle]="{ backgroundColor: alertColor }">
  <div class="header">
    <ion-icon [name]="headerIcon"></ion-icon>
    <p>{{ headerTitle }}</p>
    <ion-icon name="close" (click)="close()"></ion-icon>
  </div>
  <div class="content" *ngIf="contentText">
    <p>
      {{ contentText }}
      <ng-content></ng-content>
    </p>
  </div>
</div>
