<ion-modal
  class="share-modal"
  [isOpen]="isModalOpen"
  [presentingElement]="presentingElement"
>
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>Share</ion-title>
        <ion-buttons slot="end">
          <ion-icon name="close" color="primary" (click)="close()"></ion-icon>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <div class="container">
        <ion-searchbar
          show-clear-button="always"
          clear-icon="trash-bin"
          placeholder="Search by Email/Name"
          (ionInput)="handleInput($event)"
        ></ion-searchbar>

        <ion-list>
          <ion-item
            *ngFor="let users of filteredUsers; let index = index"
            (click)="onSelectingUser(users, index)"
            class="clickable"
          >
            <app-avatar
              [avatar]="users?.photoURL"
              [size]="40"
              [fontColor]="'#fff'"
            ></app-avatar>

            <ion-label class="ion-margin-start">
              <h2>{{ users?.fullname }}</h2>
              <p>{{ users?.email }}</p>
            </ion-label>
            <div class="selected" *ngIf="users?.isSelected">
              <ion-icon name="checkmark"></ion-icon>
            </div>
          </ion-item>
          <div
            class="no-records-found ion-no-padding ion-no-margin"
            *ngIf="noResultsFound"
          >
            <img src="../../../../assets/images/no-user-found.png" alt="" />
            <p>
              It looks like the person you're searching for isn't on
              <span>SECRETS</span> yet.
            </p>
            <p>Invite them now!</p>
            <div class="share-box">
              <a href="https://secretz.netlify.app" target="_blank"
                >https://secretz.netlify.app</a
              >
              <ion-icon
                [name]="iconName"
                color="dark"
                (click)="onCopy()"
              ></ion-icon>
            </div>
          </div>
        </ion-list>

        <div class="options" *ngIf="shareTo.length > 0">
          <div class="chiplets">
            <ion-chip *ngFor="let user of shareTo; let index = index">
              <app-avatar
                [avatar]="user?.photoURL"
                [fontColor]="'#000'"
              ></app-avatar>

              <!-- <div class="shared-avatar">
                <p *ngIf="!user?.photoURL.includes('https')">
                  {{ user?.photoURL }}
                </p>
                <img
                  alt="profile"
                  *ngIf="user?.photoURL?.includes('https')"
                  [src]="user?.photoURL"
                />
              </div> -->
              <ion-label color="dark" class="ml-10">{{ user?.id }}</ion-label>
              <ion-icon
                color="dark"
                name="close-circle"
                class="cursor-pointer"
                (click)="remove(index)"
              ></ion-icon>
            </ion-chip>
          </div>
          <ion-button
            color="primary"
            expand="block"
            id="share"
            (click)="share()"
            >Share</ion-button
          >
        </div>
      </div>
    </ion-content>
  </ng-template>
</ion-modal>
