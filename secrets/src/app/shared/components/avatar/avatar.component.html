<div
  *ngIf="avatar"
  class="avatar"
  [ngStyle]="{ width: size + 'px', height: size + 'px' }"
>
  <p
    *ngIf="!avatar.startsWith('http')"
    [ngStyle]="{ fontSize: fontSize + 'px', color: fontColor }"
  >
    {{ avatar }}
  </p>
  <img *ngIf="avatar.startsWith('http')" [src]="avatar" alt="Profile" />
</div>
